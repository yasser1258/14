<!doctype html>
<html manifest="/offline.appcache" lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090909">
  <meta name="description" content=" ياسر احمد — بوابة PS4 للإصدارات المدرجة من 9.00 إلى 14.00، وملفات GoldHEN المحلية حسب الإصدار.">
  <title> ياسر احمد للتهكير</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23090909'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%23f4c542' stroke-width='4'/%3E%3Cpath d='M16 9v7l5 3' fill='none' stroke='%23fff0bd' stroke-width='3'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <div class="shell">
    <main>
      <h1 class="sr-only" id="page-title"> ياسر احمد للتهكير PS4</h1>
      <div class="brand-artwork">
        <img src="assets/omar-interface.png" width="1672" height="941" alt=" . GoldHEN وPS4.     .">
      </div>
      <div class="offline-info" role="status" aria-live="polite"><span id="offline-status">جارٍ فحص الحفظ دون إنترنت…</span><button id="offline-reload" type="button" hidden>تحميل النسخة المحفوظة الجديدة</button></div>
      <section class="workspace" aria-labelledby="page-title">
        <div class="route-column">
          <div id="desktop-preview" class="preview-selector" hidden>
            <label for="preview-firmware">معاينة طريقة التشغيل لإصدار:</label>
            <select id="preview-firmware" dir="ltr">
              <option value="14.00">14.00</option>
              <option value="13.52">13.52</option>
              <option value="13.50">13.50</option>
              <option value="13.04">13.04</option>
              <option value="13.02">13.02</option>
              <option value="13.00">13.00</option>
              <option value="12.52">12.52</option>
              <option value="12.50">12.50</option>
              <option value="12.02">12.02</option>
              <option value="12.00">12.00</option>
              <option value="11.52">11.52</option>
              <option value="11.50">11.50</option>
              <option value="11.02">11.02</option>
              <option value="11.00">11.00</option>
              <option value="10.71">10.71</option>
              <option value="10.70">10.70</option>
              <option value="10.50">10.50</option>
              <option value="10.01">10.01</option>
              <option value="10.00">10.00</option>
              <option value="9.60">9.60</option>
              <option value="9.51">9.51</option>
              <option value="9.50">9.50</option>
              <option value="9.04">9.04</option>
              <option value="9.03">9.03</option>
              <option value="9.00">9.00</option>
            </select>
          </div>

          <div class="launch-info" aria-live="polite">
            <div class="launch-heading"><strong id="route-title">طريقة التشغيل</strong><span id="route-status" class="route-status"></span></div>
            <p id="route-detail">تُحدَّد حسب إصدار جهازك.</p>
          </div>
        </div>
        <div class="action-column">
          <button id="launch" class="primary-action" type="button" disabled><span class="play-icon" aria-hidden="true">▶</span><span id="launch-label">انتظر قراءة الإصدار</span></button>
          <p class="launch-caption" id="launch-caption">يبدأ التشغيل داخل هذه الواجهة.</p>
          <p id="action-message" class="action-message" role="status"></p>
          <noscript><p class="notice">فعّل JavaScript في المتصفح حتى يتم التعرّف على الإصدار وإظهار زر التشغيل.</p></noscript>
        </div>

      </section>

      <section id="run-panel" class="run-panel" hidden aria-label="حالة تشغيل GoldHEN">
        <p class="run-heading"> — متابعة التشغيل</p>
        <iframe id="run-frame" title="خطوات تشغيل GoldHEN ونتيجتها" referrerpolicy="same-origin"></iframe>
      </section>
    </main>

    <footer><span>  <span class="footer-divider">/</span> بوابة PS4</span><div class="contact-links"><a href="tel:" dir="ltr"> </a><a href="https: " dir="ltr" rel="noopener noreferrer"> </a></div></footer>
  </div>
  <script src="assets/offline.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
